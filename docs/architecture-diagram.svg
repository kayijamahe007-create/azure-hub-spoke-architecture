  <text x="349" y="422" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">App spoke</text>
  <text x="349" y="442" text-anchor="middle" font-size="11" fill="#134e4a">Web + app tier</text>

  <rect x="450" y="390" width="169" height="80" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <text x="534" y="422" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">Data spoke</text>
