  <line x1="340" y1="70" x2="340" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="94" text-anchor="middle" font-size="11" fill="#475569">ExpressRoute + VPN</text>

