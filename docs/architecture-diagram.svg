  <text x="90" y="158" font-size="12" fill="#64748b">Hub-spoke network (primary)</text>

  <rect x="80" y="180" width="169" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="164" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">Hub VNet</text>
  <text x="164" y="232" text-anchor="middle" font-size="11" fill="#1e3a5f">Firewall + Bastion</text>

