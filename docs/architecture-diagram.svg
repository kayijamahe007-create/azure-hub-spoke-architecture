  <text x="90" y="368" font-size="12" fill="#64748b">Secondary hub-spoke (DR)</text>

  <rect x="80" y="390" width="169" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="164" y="422" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">Hub VNet</text>
  <text x="164" y="442" text-anchor="middle" font-size="11" fill="#1e3a5f">Firewall + Bastion</text>

